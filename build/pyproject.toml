[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-agent"
version = "0.1.0"
description = "A coding agent in ~200 lines"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
    "pytest",
]

[project.scripts]
loop = "cli:main"

[tool.setuptools]
py-modules = [
    "cli",
    "config",
    "filetools",
    "step08_file_agent",
    "step09_full_agent",
    "step10_system_prompt",
    "step11_traced_agent",
]